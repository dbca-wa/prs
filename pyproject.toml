[project]
name = "prs"
version = "2.6.16"
description = "Planning Referral System corporate application"
authors = [{ name = "Ashley Felton", email = "ashley.felton@dbca.wa.gov.au" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
  "django==5.2.19",
  "psycopg[binary,pool]==3.3.9",
  "gunicorn[fast]==27.0.1",
  "python-dotenv==1.2.4",
  "dbca-utils==3.0.16",
  "dj-database-url==3.1.2",
  "django-extensions==4.1",
  "django-crispy-forms==2.7",
  "crispy-bootstrap5==2026.9",
  "django-reversion==6.5.2",
  "django-taggit==7.0.0",
  "requests==2.34.2",
  "unidecode==1.4.0",
  "pillow==13.0.0",
  "python-magic==0.4.27",
  "lxml[html-clean]==6.1.3",
  "xmltodict==1.0.4",
  "extract-msg==0.58.2",
  "webtemplate-dbca==1.9.1",
  "geojson==3.3.0",
  "typesense==2.1.1",
  "pdfminer-six==20260107",
  "docx2txt==0.9",
  "celery[redis]==5.7.0",
  "django-celery-results==2.6.0",
  "whitenoise[brotli]==6.12.0",
  "django-crum==0.7.9",
  "sentry-sdk[django]==2.75.0",
  "redis==8.1.0",
  "xlsxwriter==3.3.3",
  "django-storages[azure]==1.14.6",
  "shapely==2.2.0",
  "fiona==1.10.1",
  "pyproj==3.8.0",
  "fudgeo==1.6.0",
  "django-valkey[libvalkey]==0.5.0",
]

[dependency-groups]
dev = [
  "ipython>=9.19",
  "ipdb>=0.13",
  "mixer>=7.2",
  "pre-commit>=4.7",
  "coverage>=7.16",
  "django-stubs>=6.1",
  "deptry>=0.25",
]

[tool.ruff]
line-length = 140
indent-width = 4
extend-exclude = ["migrations"]

[tool.ruff.lint]
ignore = [
  "E265",   # Block comment should start with #
  "E501",   # Line too long
  "E722",   # Bare except
  "BLE001", # Blind except: https://docs.astral.sh/ruff/rules/blind-except/
]

# Reference: https://www.djlint.com/docs/configuration/
[tool.djlint]
profile = "django"

[tool.deptry]
ignore = ["DEP004"]
[tool.deptry.per_rule_ignores]
DEP002 = [
  "django-extensions",
  "gunicorn",
  "psycopg",
  "whitenoise",
  "crispy-bootstrap5",
  "webtemplate-dbca",
  "pillow",
  "django-storages",
  "django-celery-results",
  "django-valkey",
]
DEP003 = ["lxml_html_clean"]

[tool.pyright]
venvPath = ".venv"
include = ["harvester", "indexer", "prs", "referral", "reports"]
exclude = ["**/migrations", "kustomize"]
