[project]
name = "prs"
version = "2.6.10"
description = "Planning Referral System corporate application"
authors = [{ name = "Ashley Felton", email = "ashley.felton@dbca.wa.gov.au" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
  "django==6.0.8",
  "psycopg[binary,pool]==3.3.4",
  "dbca-utils==3.0.13",
  "python-dotenv==1.2.2",
  "dj-database-url==3.1.2",
  "gunicorn[fast]==26.0.0",
  "django-extensions==4.1",
  "django-crispy-forms==2.7",
  "crispy-bootstrap5==2026.3",
  "django-reversion==6.3.0",
  "django-taggit==6.1.0",
  "requests==2.34.2",
  "unidecode==1.4.0",
  "pillow==12.3.0",
  "python-magic==0.4.27",
  "lxml[html-clean]==6.1.1",
  "xmltodict==1.0.4",
  "extract-msg==0.56.0",
  "webtemplate-dbca==1.9.0",
  "geojson==3.3.0",
  "typesense==2.0.0",
  "pdfminer-six==20260107",
  "docx2txt==0.9",
  "celery==5.6.3",
  "django-celery-results==2.6.0",
  "whitenoise[brotli]==6.12.0",
  "django-crum==0.7.9",
  "sentry-sdk[django]==2.66.1",
  "redis==8.1.0",
  "xlsxwriter==3.2.9",
  "django-storages[azure]==1.14.6",
  "shapely==2.1.2",
  "fiona==1.10.1",
  "pyproj==3.7.2",
  "fudgeo==1.5.10",
  "django-valkey[libvalkey]==0.4.1",
]

[dependency-groups]
dev = [
  "ipython>=9.16.1",
  "ipdb>=0.13.13",
  "mixer>=7.2.2",
  "pre-commit>=4.6.1",
  "coverage>=7.15.4",
  "django-stubs>=6.0.7",
  "deptry>=0.25.1",
]

[tool.ruff]
line-length = 140
indent-width = 4
extend-exclude = ["migrations"]

[tool.ruff.lint]
ignore = [
  "E265", # Block comment should start with #
  "E501", # Line too long
  "E722", # Bare except
]

# Reference: https://www.djlint.com/docs/configuration/
[tool.djlint]
profile = "django"

[tool.deptry]
ignore = ["DEP004"]
[tool.deptry.per_rule_ignores]
DEP002 = [
  "django-extensions",
  "gunicorn",
  "psycopg",
  "whitenoise",
  "crispy-bootstrap5",
  "webtemplate-dbca",
  "pillow",
  "django-storages",
  "django-celery-results",
  "django-valkey",
]
DEP003 = ["lxml_html_clean"]

[tool.pyright]
venvPath = ".venv"
include = ["harvester", "indexer", "prs", "referral", "reports"]
exclude = ["**/migrations", "kustomize"]
