apiVersion: batch/v1
kind: CronJob
metadata:
  name: prs-cronjob
spec:
  schedule: '0 9 * * 1'
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: prs-cronjob
              args: ['manage.py', 'overdue_tasks_email']
              envFrom:
                - secretRef:
                    name: prs-env-uat
