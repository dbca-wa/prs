apiVersion: batch/v1
kind: CronJob
metadata:
  name: prs-cronjob
spec:
  schedule: '0 9-17 * * 1-5'
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: prs-cronjob
              args: ['manage.py', 'harvest_email_referrals', '--email']
              envFrom:
                - secretRef:
                    name: prs-env-uat
