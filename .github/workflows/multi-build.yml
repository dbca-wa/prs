# Builds and pushes the multi-architecture (amd64/arm64) image to GHCR
# using the shared docker-bake.hcl, so local and CI builds are identical.
name: Build multi-architecture image

on:
  schedule:
    - cron: '21 21 * * 1-5'
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_ref: ${{ env.GHCR_IMAGE }}:${{ steps.image_tag.outputs.value }}
    permissions:
      contents: read
      packages: write # push image to GHCR
      attestations: write # image provenance / SLSA
      id-token: write # OIDC for provenance
    steps:
      - name: Harden the GitHub runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image_tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$tag" ]; then
            # strip a leading 'v' (e.g. v1.2.3 -> 1.2.3)
            semtag="${tag#v}"
            echo "value=${semtag}" >> "$GITHUB_OUTPUT"
            echo "tags=${GHCR_IMAGE}:latest,${GHCR_IMAGE}:${semtag}" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
            echo "tags=${GHCR_IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push with Docker Buildx
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          push: true
          targets: all
          set: |
            app.tags=${{ env.GHCR_IMAGE }}:latest
            ${{ steps.image_tag.outputs.has_version_tag == 'true' && format('app.tags={0}:{1}', env.GHCR_IMAGE, steps.image_tag.outputs.value) || '' }}

  scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true # If vulnerability scan fails, the workflow can still complete successfully.
    needs:
      - build
    permissions:
      contents: read
      packages: read
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Run Anchore vulnerability scanner
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ needs.build.outputs.image_ref }}
          fail-build: false
          output-format: sarif
          severity-cutoff: high
          only-fixed: true
          cache-db: true

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
